name: Get Debug SHA-1

on:
  workflow_dispatch:   # Run manually

# ✅ Required permission to push commits
permissions:
  contents: write

jobs:
  sha1:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 2️⃣ Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3️⃣ Generate Debug Keystore
      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      # 4️⃣ Extract SHA-1 into file
      - name: Get Debug SHA-1
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep SHA1 > SHA1.txt

      # 5️⃣ Commit file back to repo
      - name: Commit SHA File
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add SHA1.txt
          git commit -m "Add debug SHA fingerprint" || echo "No changes to commit"
          git push